services:
  postgres:
    image: postgis/postgis:15-3.3@sha256:a2fc46b52819d25add4ed93d3da83e106e17ea3ace6883cce3791631c9820bb2 # 15-3.3
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Postgres password must be set (POSTGRES_PASSWORD)}
    # Production: do not publish the Postgres port. The superuser port is reachable
    # only from inside the Docker network. Local tools that need direct access should
    # use a git-ignored docker-compose.override.yml (see docs/infra/bin-start.md) or
    # bind to 127.0.0.1 only.
    #
    # Example override (do not commit):
    #   services.postgres.ports = ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    ports: []
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Postgres (parent of postgis) needs these to operate; keep the minimum.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 200
    networks:
      - safetrust-network

  # Admin role (migrations / metadata / seeds). Used only by the migration step
  # (bin/start, bin/prepare-test-db), never by a long-running service.
  #
  # The webhook and Hasura connect as least-privilege roles (see per-service docs).
  x-admin-db-url: &admin-db-url
    postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres

  graphql-engine:
    image: hasura/graphql-engine:v2.47.0@sha256:ceefc35c505b3c6201c89549f383d69bfae15f6124895b2e6f712b66f5612677 # v2.47.0
    # Bind to loopback by default. A reverse proxy / deployment platform exposes
    # Hasura publicly; it is not published on all interfaces from the host.
    ports:
      - "127.0.0.1:${HASURA_PORT:-8080}:8080"
    restart: always
    environment:
      # Hasura metadata lives in its own database (hasura_metadata), owned by the
      # hasura_metadata role, so a data breach on a tenant database does not expose
      # the Hasura catalog. The data source role (hasura) has no rights on that DB.
      HASURA_GRAPHQL_METADATA_DATABASE_URL: >-
        postgres://hasura_metadata:${POSTGRES_PASSWORD}@postgres:5432/hasura_metadata
      # Data source: Hasura connects to tenant databases as the hasura role, which
      # only has USAGE + table privileges on safetrust / hotel_industry.
      PG_DATABASE_URL: >-
        postgres://hasura:${POSTGRES_PASSWORD}@postgres:5432/postgres
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      # query-log writes every GraphQL query with its variables (emails, phone
      # numbers, wallet addresses) to the container log. Off by default; enable
      # per-run for debugging.
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: >-
        startup, http-log, webhook-log, websocket-log
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?Hasura admin secret must be set (HASURA_GRAPHQL_ADMIN_SECRET)}
      HASURA_GRAPHQL_JWT_SECRET: ${HASURA_GRAPHQL_JWT_SECRET}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://127.0.0.1:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 200
    networks:
      - safetrust-network

  webhook:
    build:
      # Repo root: the webhook image needs the root Cargo workspace (Cargo.toml,
      # Cargo.lock, crates/) alongside webhook/, so it cannot build from ./webhook.
      context: .
      dockerfile: webhook/Dockerfile
      # Cross-platform layer cache — works on Linux, macOS Docker Desktop,
      # and GitHub Actions (ACTIONS_CACHE_URL not required for local dev).
      # Relative path is accessible from Docker's build context on all platforms;
      # /tmp/docker-cache breaks on macOS Desktop (host /tmp ≠ VM /tmp).
      cache_from:
        - type=local,src=.docker-cache/webhook
      cache_to:
        - type=local,dest=.docker-cache/webhook,mode=max
    container_name: safetrust-webhook
    # Bind to loopback by default. A reverse proxy / deployment platform exposes
    # the webhook publicly.
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-3000}:${WEBHOOK_PORT:-3000}"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${WEBHOOK_PORT:-3000}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-3000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-webhook}
      # Prefer file-backed secrets in production (mounted at /run/secrets/...). The
      # webhook supports the *_FILE variants for these values; if both the plain
      # variable and the _FILE variant are set, the _FILE variant wins.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_GRAPHQL_ADMIN_SECRET_FILE: ${HASURA_GRAPHQL_ADMIN_SECRET_FILE:-}
      HASURA_GRAPHQL_ENDPOINT: >-
        http://127.0.0.1:8080/v1/graphql
      TRUSTLESSWORK_API_URL: ${TRUSTLESSWORK_API_URL:-https://dev.api.trustlesswork.com}
      TRUSTLESSWORK_API_KEY: ${TRUSTLESSWORK_API_KEY}
      TRUSTLESSWORK_API_KEY_FILE: ${TRUSTLESSWORK_API_KEY_FILE:-}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      # x402 is quarantined from the eligibility path until F2/F3/F8 are closed.
      X402_ENABLED: ${X402_ENABLED:-false}
      X402_SETTLE_ENABLED: ${X402_SETTLE_ENABLED:-false}
      # The current Soroban reader fabricates state; keep drift validation off.
      SOROBAN_VALIDATION_ENABLED: ${SOROBAN_VALIDATION_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      graphql-engine:
        condition: service_healthy
    healthcheck:
      # The webhook image no longer ships curl. Use the Node runtime that is
      # already in the image; the port comes from the PORT env the compose file sets.
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/webhook/dist
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 100
    secrets:
      - source: postgres-password
        target: /run/secrets/postgres-password
      - source: hasura-admin-secret
        target: /run/secrets/hasura-admin-secret
      - source: trustlesswork-api-key
        target: /run/secrets/trustlesswork-api-key
    networks:
      - safetrust-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  safetrust-network:
    driver: bridge

secrets:
  # File-backed secrets for production. Values are still accepted as environment
  # variables for local development; the *_FILE variants above drive the mounts.
  #
  # Set these in the environment / CI secrets / deployment platform:
  #   POSTGRES_PASSWORD
  #   HASURA_GRAPHQL_ADMIN_SECRET
  #   TRUSTLESSWORK_API_KEY
  #
  postgres-password:
    environment: POSTGRES_PASSWORD
  hasura-admin-secret:
    environment: HASURA_GRAPHQL_ADMIN_SECRET
  trustlesswork-api-key:
    environment: TRUSTLESSWORK_API_KEY
