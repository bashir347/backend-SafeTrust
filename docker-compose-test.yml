version: "3.9"

services:
  postgres-test:
    image: postgis/postgis:15-3.3@sha256:a2fc46b52819d25add4ed93d3da83e106e17ea3ace6883cce3791631c9820bb2 # 15-3.3
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD or provide it via POSTGRES_PASSWORD_FILE}"
      POSTGRES_DB: "${POSTGRES_DB:-safetrust}"
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-safetrust}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    networks:
      - internal

  hasura-test:
    image: hasura/graphql-engine:v2.47.0@sha256:ceefc35c505b3c6201c89549f383d69bfae15f6124895b2e6f712b66f5612677 # v2.47.0
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9696:9695"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: "postgresql://${HASURA_DB_USER:-hasura}:${HASURA_DB_PASSWORD:?Set HASURA_DB_PASSWORD or provide it via HASURA_DB_PASSWORD_FILE}@postgres-test:5432/${POSTGRES_DB:-safetrust}"
      HASURA_GRAPHQL_METADATA_DATABASE_URL: "postgresql://${HASURA_METADATA_USER:-hasura_metadata}:${HASURA_METADATA_PASSWORD:?Set HASURA_METADATA_PASSWORD or provide it via HASURA_METADATA_PASSWORD_FILE}@postgres-test:5432/hasura_metadata"
      HASURA_GRAPHQL_ADMIN_SECRET: "${HASURA_GRAPHQL_ADMIN_SECRET:?Set HASURA_GRAPHQL_ADMIN_SECRET or provide it via HASURA_GRAPHQL_ADMIN_SECRET_FILE}"
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      # Set HASURA_GRAPHQL_QUERY_LOG to "true" only when debugging. It is off by default.
      HASURA_GRAPHQL_QUERY_LOG: "false"
      HASURA_GRAPHQL_LOG_LEVEL: "info"
    depends_on:
      postgres-test:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    networks:
      - internal

  webhook-test:
    build:
      context: ./webhook
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: "postgresql://${WEBHOOK_DB_USER:-webhook}:${WEBHOOK_DB_PASSWORD:?Set WEBHOOK_DB_PASSWORD or provide it via WEBHOOK_DB_PASSWORD_FILE}@postgres-test:5432/${POSTGRES_DB:-safetrust}"
      HASURA_GRAPHQL_ADMIN_SECRET: "${HASURA_GRAPHQL_ADMIN_SECRET:?Set HASURA_GRAPHQL_ADMIN_SECRET or provide it via HASURA_GRAPHQL_ADMIN_SECRET_FILE}"
      TRUSTLESSWORK_API_KEY: "${TRUSTLESSWORK_API_KEY:-}"
      TRUSTLESSWORK_WEBHOOK_SECRET: "${TRUSTLESSWORK_WEBHOOK_SECRET:-}"
      FIREBASE_PRIVATE_KEY: "${FIREBASE_PRIVATE_KEY:-}"
      IS_TEST: "true"
    secrets:
      - POSTGRES_PASSWORD
      - HASURA_GRAPHQL_ADMIN_SECRET
      - TRUSTLESSWORK_API_KEY
      - TRUSTLESSWORK_WEBHOOK_SECRET
      - FIREBASE_PRIVATE_KEY
    depends_on:
      postgres-test:
        condition: service_healthy
      hasura-test:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/dist
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    networks:
      - internal

secrets:
  POSTGRES_PASSWORD:
    environment: POSTGRES_PASSWORD
  HASURA_GRAPHQL_ADMIN_SECRET:
    environment: HASURA_GRAPHQL_ADMIN_SECRET
  TRUSTLESSWORK_API_KEY:
    environment: TRUSTLESSWORK_API_KEY
  TRUSTLESSWORK_WEBHOOK_SECRET:
    environment: TRUSTLESSWORK_WEBHOOK_SECRET
  FIREBASE_PRIVATE_KEY:
    environment: FIREBASE_PRIVATE_KEY

networks:
  internal:
    driver: bridge
